name: Windows Manager Integration

on:
  push:
    branches:
      - main
      - feature/manager-foundation
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run Manager and Product Agent tests
        run: python -m pytest tests/test_manager.py -q
